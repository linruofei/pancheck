name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Build Frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          rm -rf static
          cp -r frontend/dist static

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Linux AMD64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o pancheck-server ./cmd/api
          chmod +x pancheck-server
          tar -czf pancheck-linux-amd64.tar.gz pancheck-server static/ start_pancheck.sh

      - name: Build Linux ARM64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o pancheck-server ./cmd/api
          chmod +x pancheck-server
          tar -czf pancheck-linux-arm64.tar.gz pancheck-server static/ start_pancheck.sh

      - name: Generate Version Info
        run: |
          VERSION="v$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')"
          echo "$VERSION" > version.txt
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest || true

          # 删除旧 release 重新创建，确保每次资源包都是最新的
          gh release delete latest --yes || true
          gh release create latest \
            pancheck-linux-amd64.tar.gz \
            pancheck-linux-arm64.tar.gz \
            version.txt \
            --title "PanCheck ${{ env.BUILD_VERSION }}" \
            --notes "Build: ${{ env.BUILD_VERSION }} | Commit: ${{ github.sha }} | Built at: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S CST')"

          # 如果带有版本标签 (如 v1.0.0)，同时发布独立版本
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            gh release create "$TAG_NAME" \
              pancheck-linux-amd64.tar.gz \
              pancheck-linux-arm64.tar.gz \
              version.txt \
              --title "PanCheck $TAG_NAME" \
              --notes "Release $TAG_NAME" \
              --clobber || true
          fi
